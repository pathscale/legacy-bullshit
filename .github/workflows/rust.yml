name: Rust

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# What runs here is deliberately small: build, test, lint, publish. Anything
# expensive - Miri, the feature matrix, the benchmarks - lives in `manual.yml`
# behind `workflow_dispatch`, because it belongs to whoever is investigating
# something, not to every push.
jobs:
  build:
    if: ${{ !inputs.publish }}
    name: Build and test
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      # Not `--all-targets`: that pulls in the bench targets, and a benchmark
      # has no business running on a shared runner. `cargo test` on its own
      # covers lib, integration tests and doctests, and skips benches.
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose --all-features
      # The record APIs do not require alloc. The rustls adapter does.
      - name: Build the record APIs for a bare-metal target
        run: |
          rustup target add aarch64-unknown-none
          cargo build --lib --features quic-initial,tls13-aes128-gcm,webhook-v1 --target aarch64-unknown-none

  lint:
    if: ${{ !inputs.publish }}
    name: Format and clippy
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --lib --bins --tests --all-features -- -D warnings

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master snapshot; stable toolchain
        with:
          toolchain: stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io --no-verify
