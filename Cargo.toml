[package]
name = "legacy-bullshit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "The legacy crypto the standards force on an ECC and ChaCha20 client, and nothing more: verify-only RSA for TLS 1.3 and AES-128 for QUIC Initial packets. no_std, no alloc, no unsafe"
repository = "https://github.com/pathscale/legacy-bullshit"
readme = "README.md"
keywords = ["rsa", "tls", "quic", "aes-gcm", "no-std"]
categories = ["cryptography", "no-std"]
exclude = ["tests/data", "fuzz"]

[dependencies]
# Hashing only. Default features off: no std, no alloc.
sha2 = { version = "^0.11", default-features = false }
# QUIC Initial packets only. RustCrypto, audited, constant-time, no alloc.
aes = { version = "^0.9", default-features = false }
aes-gcm = { version = "^0.11", default-features = false, features = ["aes"] }

[dev-dependencies]
# Reads the vendored Wycheproof JSON. Test-only.
serde_json = "^1"
hex = "^0.4"
# Derives the RFC 9001 Appendix A Initial keys in tests. Test-only.
hkdf = "^0.13"
